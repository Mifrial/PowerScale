<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharGen — Сброс пароля</title>
<link rel="stylesheet" href="common.css">
</head><body>
<div class="auth-page">
  <div class="auth-card">
    <h1>Сброс пароля</h1>
    <p class="subtitle">Введите логин или email. Если email привязан к аккаунту — на него придёт ссылка для сброса.</p>
    <form>
      <div class="form-group">
        <label class="form-label">Логин или email</label>
        <input class="form-input" type="text" placeholder="ivan_p или ivan@example.com">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center">Отправить ссылку</button>
      <div class="form-footer">
        <a href="login.html">Вернуться ко входу</a>
      </div>
    </form>
  </div>
</div>
</body></html>
