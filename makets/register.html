<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharGen — Регистрация</title>
<link rel="stylesheet" href="common.css">
</head><body>
<div class="auth-page">
  <div class="auth-card">
    <h1>Регистрация</h1>
    <p class="subtitle">Создайте учётную запись</p>
    <form>
      <div class="form-group">
        <label class="form-label">Логин *</label>
        <input class="form-input" type="text" placeholder="my_nickname">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="mail@example.com">
        <div style="font-size:12px;color:#aaa;margin-top:4px">Рекомендуется для сброса пароля. Если заполнен — должен быть уникальным.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Пароль *</label>
        <input class="form-input" type="password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label">Подтверждение пароля *</label>
        <input class="form-input" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="location.href='games-list.html'">Зарегистрироваться</button>
      <div class="form-footer">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </div>
    </form>
  </div>
</div>
</body></html>
